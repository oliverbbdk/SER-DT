/* Official film trailers replace the temporary illustrated posters. */
.film-media{aspect-ratio:16/9;min-height:210px;background:#08090c;border-bottom:1px solid var(--line)}
.film-media iframe{display:block;width:100%;height:100%;min-height:210px;border:0}
.trailer-source{display:inline-block;color:var(--gold);font-size:11px;line-height:1.6;margin-top:17px}
.trailer-link{display:inline-flex;gap:9px;align-items:center;min-height:44px;background:transparent;border:1px solid #9d7951;color:var(--gold);padding:8px 13px;font-size:12px;line-height:1.4;text-align:left;margin-top:14px}
.trailer-link:hover{background:#202126;border-color:var(--gold)}
.trailer-link span{font-size:20px;line-height:1}
.trailer-button-group,.small-hall-trailers{display:flex;flex-wrap:wrap;gap:12px}
.small-hall-trailers{margin-top:12px}
.trailer-dialog{width:min(960px,calc(100% - 32px));max-width:960px;background:#08090c;padding:24px}
.trailer-dialog-header{display:flex;justify-content:space-between;align-items:start;gap:20px;margin-bottom:20px}
.trailer-dialog-header h2{font-size:34px;margin:0;line-height:1.2}
.trailer-close{display:grid;place-items:center;flex-shrink:0;width:44px;height:44px;line-height:1;font-size:29px;background:var(--gold);color:#161218;border:0}
.trailer-frame{aspect-ratio:16/9;min-height:200px;background:#000}
.trailer-frame iframe{display:block;width:100%;height:100%;min-height:200px;border:0}
.trailer-dialog>p{font-size:12px;margin:15px 0 0;color:#d8c6b5}
.trailer-credit-list{padding-left:17px;line-height:1.8}
@media(max-width:800px){.film-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:700px){.film-grid{grid-template-columns:1fr}.film-card{display:block}.film-info{padding:24px}.film-info h3{font-size:32px}.film-info p{font-size:14px}.film-tag{font-size:10px}.film-info .rating{font-size:11px}}
@media(max-width:560px){.trailer-dialog{padding:15px}.trailer-dialog-header h2{font-size:27px}.trailer-link{font-size:11px}.trailer-source{font-size:11px}.small-hall-trailers{gap:4px 12px}}

.film-media,.trailer-frame{width:100%;max-width:100%;min-width:0}.film-media iframe,.trailer-frame iframe{max-width:100%;min-width:0}

/* Trailer previews remain useful when an embedded player cannot load. */
.trailer-preview{position:relative;display:block;isolation:isolate;width:100%;height:100%;min-height:210px;overflow:hidden;text-decoration:none;background:radial-gradient(ellipse at 30% 15%,#5a4b30,#191b25 60%,#0d1019)}
.film-media .trailer-preview img{position:absolute;inset:0;width:100%;height:100%;min-height:0;object-fit:cover;aspect-ratio:auto;transition:transform .25s}
.trailer-preview:hover img{transform:scale(1.035)}
.trailer-poster-label{position:absolute;inset:22px 24px auto;color:#f2eee3;font-family:'Bebas Neue',Impact,sans-serif;font-size:32px;line-height:1.15}
.trailer-poster-label small{display:block;font:10px Arial,sans-serif;letter-spacing:.14em;margin-top:10px;color:#e0cd99}
.trailer-play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:grid;place-items:center;width:60px;height:60px;border-radius:50%;border:1px solid #fff9;background:#000c;color:#f3c45b;font-size:22px;padding-left:3px;box-shadow:0 2px 24px #0008}
.trailer-watch{position:absolute;bottom:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:20px 18px 12px;background:linear-gradient(transparent,#000e);font-size:12px;font-weight:700;color:#fff}
.trailer-link{text-decoration:none}
.trailer-stage{position:relative;width:100%;max-width:100%;min-width:0;aspect-ratio:16/9;min-height:200px;isolation:isolate;background:#171b24}
.trailer-stage .trailer-frame{position:absolute;inset:0;aspect-ratio:auto;height:100%}
.trailer-poster{position:absolute;inset:0;z-index:1;display:grid;place-content:center;gap:22px;justify-items:center;background:radial-gradient(ellipse at 25% 5%,#5a4b30,#191b25 65%);overflow:hidden}
.trailer-poster>span{z-index:1;align-self:center;text-align:center;max-width:90%;font:clamp(28px,5vw,60px)/1.1 'Bebas Neue',Impact,sans-serif;color:#fff;text-shadow:0 2px 12px #000;background:#0009;padding:8px 15px}
.trailer-poster>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.65}
.trailer-poster>.button{z-index:1}
.trailer-external{margin-top:12px}
.trailer-dialog #trailer-status{font-size:13px;min-height:2.8em;color:#e1e0dd;margin:18px 0 0}

:root{--display:'Bebas Neue',Impact,'Arial Narrow',sans-serif;--gold:#f3c45b;--paper:#f2eee3;--pink:#d9a6a2;--line:#373637}
body{font-size:15px;line-height:1.75;letter-spacing:.005em;background:#000}
html{scroll-padding-top:110px}
.topline{padding:8px 16px;font-size:10px;letter-spacing:.14em;color:#b9b6b0;border-color:#28282d}
.site-header{position:sticky;top:0;z-index:30;background:#000;border-color:#29292e}
.nav{min-height:86px;gap:34px}.logo{gap:11px}.logo svg{width:43px}.logo-text{font-family:Creepster,Impact,sans-serif;font-size:29px;letter-spacing:0}
.nav-links{gap:27px}.nav-links>a{font-size:12px;font-weight:600;letter-spacing:.02em}.nav-links>.button{padding:12px 23px;font-size:12px}
.button{font-size:12px;font-weight:700;letter-spacing:.025em;padding:14px 25px;min-height:48px;transition:background .18s,border-color .18s,color .18s}
.button:hover{transform:none;background:#ffdb83}.button.secondary{border-color:#5d5a51}.button.secondary:hover{background:#17181c;border-color:#a19b88}
.eyebrow{font-size:10px;letter-spacing:.18em;font-weight:600}
.hero{gap:80px;padding-top:64px;padding-bottom:70px;grid-template-columns:1fr 1fr;align-items:center}
.hero h1{font-size:clamp(76px,7.9vw,118px);line-height:.94;letter-spacing:.012em;margin-bottom:26px;font-weight:400}
.hero-copy .eyebrow{margin-bottom:23px}.hero-copy>p:not(.eyebrow){font-size:16px;max-width:430px;color:#ccc9c1;line-height:1.8}
.hero-meta{font-size:9px;letter-spacing:.09em;color:#c1bdb4;margin-top:28px;gap:15px}.hero-meta span+span{border-color:#3b3b3e;padding-left:15px}
.actions{margin-top:30px;gap:12px}.hero-art{padding:10px 12px 10px 0}.eye-ticket{transform:rotate(1.5deg);outline:none;border:1px solid #6c4e4f;box-shadow:8px 8px 0 #131316;padding:27px 33px 0}
.ticket-top{font-size:8px;letter-spacing:.15em;padding-bottom:13px;opacity:.85}.eye-ticket .big-eye{margin:37px 0 29px}.ticket-label{font-size:43px;line-height:1.04;letter-spacing:.02em;margin-bottom:26px}.ticket-bottom{font-size:9px;letter-spacing:.08em;border-top:1px dashed #7a5757;margin-inline:-33px;padding:17px 27px}.ticket-bottom strong{font-size:20px;font-weight:600}
.sticker{clip-path:none;border:1px solid #291419;border-radius:50%;width:92px;height:92px;right:-7px;top:-8px;transform:rotate(9deg);font-size:20px;letter-spacing:.025em}.small-star{display:none}
.marquee{border-color:#28282e;background:#08090b}.marquee-inner{font-size:9px;letter-spacing:.16em;padding:16px 0;font-weight:500;color:#c5c1b8}.marquee b{font-size:11px}
.section{padding-block:82px}.section-head{align-items:end;margin-bottom:32px}.section h2,.page-intro h1,.closing h2{letter-spacing:.015em;font-weight:400}.section h2{font-size:clamp(42px,4.2vw,64px);line-height:1.04;margin-top:11px}.section-head>a{font-size:12px;color:#d6d2c8;text-underline-offset:6px}
.film-grid{gap:24px}.film-card{background:#101114;border-color:#303136}.film-media{border-color:#303136}.film-info{padding:26px}.film-tag{font-size:9px;letter-spacing:.11em;color:#bcb5a7}.film-info h3{font-size:34px;letter-spacing:.015em;margin-top:10px;margin-bottom:12px;line-height:1.05}.film-info p{font-size:13px;color:#c0bdb4;line-height:1.8}.rating{font-size:10px;margin-top:20px;gap:10px}.rating .dots{letter-spacing:2px}.trailer-source{font-size:10px;margin-top:20px;text-underline-offset:5px}
.fieldset-note{color:#999a9f;font-size:10px;line-height:1.7}
.split-feature{border-color:#35363b;background:#101114}.split-feature .feature-graphic{min-height:370px}.feature-copy{padding:50px}.feature-copy h2{font-size:51px;line-height:1.03}.feature-copy p{font-size:14px;color:#c5c1b8;line-height:1.8}.text-link{font-size:12px;font-weight:600;letter-spacing:.01em}
.feature-graphic:before,.feature-graphic:after{font-size:40px;color:#8a6b45;opacity:.55}
.closing{padding:64px 28px}.closing h2{font-size:56px;line-height:1.08;max-width:800px;margin:15px auto 18px}.closing p{font-size:14px}.closing .button{margin-top:16px;border-color:#291419}
.site-footer{padding-top:48px;background:#000;border-color:#303136}.footer-top{gap:65px;grid-template-columns:1.2fr 1fr 1fr}.footer-top p{font-size:12px;line-height:1.9;color:#a7a39c}.footer-top h2{font-size:10px;letter-spacing:.13em;margin-bottom:20px;font-weight:600}.footer-links{gap:9px 18px}.footer-links a{font-size:12px;color:#c7c3b9}.footer-bottom{border-color:#2f3035;color:#8e8d89;font-size:10px;padding-top:23px;margin-top:38px}.credits{font-size:10px;max-width:440px}.credits p{line-height:1.8}

\u003cellipse cx=\"267\" cy=\"124\" rx=\"13\" ry=\"19\" fill=\"#f5e9d2\"/>\u003cpath d=\"M57 137q53-46 99-54m190 2q57 13 94 49\" fill=\"none\" stroke=\"#291419\" stroke-width=\"4\"/>\u003c/svg>\u003cspan class=\"logo-text\">SE\u003cbr>RØDT\u003c/span>\u003c/a>\n\u003cbutton class=\"menu-toggle\" type=\"button\" aria-expanded=\"false\" aria-controls=\"main-navigation\">Menu \u003cspan aria-hidden=\"true\">☰\u003c/span>\u003c/button>\n\u003cnav class=\"nav-links\" id=\"main-navigation\" aria-label=\"Hovednavigation\">\u003ca href=\"#program\">Program\u003c/a>\u003ca href=\"#filter\">Om filteret\u003c/a>\u003ca href=\"#praktisk\" aria-current=\"page\">Praktisk info\u003c/a>\u003ca href=\"#faq\">FAQ\u003c/a>\u003ca href=\"#billetter\" class=\"button\">Køb billet\u003c/a>\u003c/nav>\u003c/div>\u003c/header>\u003cmain id=\"main\">\u003cdiv class=\"wrap\">\u003cdiv class=\"page-intro\">\u003cp class=\"eyebrow gold\">Alt det, du gerne vil vide først\u003c/p>\u003ch1>FIND VEJ\u003cbr>TIL MØRKET.\u003c/h1>\u003cp>To aftener på Refshaleøen med film, aktiviteter og pauser. Her finder du de praktiske oplysninger i festival-konceptet.\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"wrap page-content\">\u003cdiv class=\"info-grid\">\u003csection class=\"paper-panel\">\u003cp class=\"eyebrow\">Sæt kryds i kalenderen\u003c/p>\u003cdiv class=\"big-date\">30—31\u003cbr>OKTOBER.\u003c/div>\u003cp>\u003cstrong>Refshaleøen, København\u003c/strong>\u003cbr>En rå værkstedshal danner rammen om festivalen.\u003c/p>\u003cp>Fredag åbner dørene kl. 18:00.\u003cbr>Lørdag starter aktiviteterne kl. 16:00.\u003c/p>\u003cp>Det præcise venue og eventår er endnu ikke fastlagt i skoleprojektets koncept.\u003c/p>\u003ca class=\"button\" href=\"#program\">Find din aften \u003cspan aria-hidden=\"true\">↗\u003c/span>\u003c/a>\u003c/section>\n\u003csection class=\"info-box\">\u003ch2>EN PLADS TIL ALLE.\u003c/h2>\u003cdl>\u003cdt>Aldersgrænse\u003c/dt>\u003cdd>18 år. Også gæster uden farveblindhed er velkomne.\u003c/dd>\u003cdt>Fysisk adgang\u003c/dt>\u003cdd>Konceptet omfatter niveaufri adgang og handicaptoilet.\u003c/dd>\u003cdt>Ro og pauser\u003c/dt>\u003cdd>Roligt pauserum, garderobe og et brætspilshjørne.\u003c/dd>\u003cdt>To sale\u003c/dt>\u003cdd>Stor sal med 170 pladser og lille sal med 80 pladser.\u003c/dd>\u003c/dl>\u003c/section>\n\u003csection class=\"info-box\">\u003ch2>REJSEN HERNED.\u003c/h2>\u003cp>Konceptet lægger op til havnebus, cykelparkering og information om natbus.\u003c/p>\u003cp>Præcis adresse, stop og aktuelle afgange kommer, når venue og dato er fastlagt. Planlæg også hjemturen: programmet fortsætter efter midnat.\u003c/p>\u003cp>Vi viser ikke et kort med et ubekræftet mødested.\u003c/p>\u003c/section>\n\u003csection class=\"info-box\">\u003ch2>PAUSER MED SMAG.\u003c/h2>\u003cp>Food trucks og en Halloween-bar er en del af konceptet. Der planlægges vegetariske og veganske muligheder.\u003c/p>\u003cp>Gå på opdagelse i farvequiz, fotobox, filterstation og historievæg — eller tag en stille pause mellem filmene.\u003c/p>\u003cp>Udklædning er frivillig. Lørdag er der kostumekonkurrence.\u003c/p>\u003c/section>\u003c/div>\u003cp class=\"note\">Priser: fredag 299 kr. · lørdag 349 kr. · festivalpas 549 kr. · VIP 799 kr. \u003ca href=\"#billetter\">Se billetmulighederne\u003c/a>.\u003c/p>\u003c/div>\u003c/main>\u003cfooter class=\"site-footer\">\u003cdiv class=\"wrap\">\u003cdiv class=\"footer-top\">\n\u003cdiv>\u003ca class=\"logo\" href=\"#forside\" aria-label=\"SE RØDT — forsiden\">\u003csvg viewBox=\"0 0 500 290\" xmlns=\"http://www.w3.org/2000/svg\" aria-hidden=\"true\">\u003cg fill=\"none\" stroke=\"#291419\" stroke-width=\"9\" stroke-linecap=\"round\">\u003cpath d=\"M65 81 42 47m72 12-8-38m73 23 8-36m67 31 19-31m56 48 29-29m41 57 39-17M60 206l-28 30m78-12-12 38m78-25 9 38m66-39 18 34m63-50 30 28m38-57 42 14\"/>\u003c/g>\u003cpath d=\"M20 150Q250-80 480 150Q250 390 20 150Z\" fill=\"#f5e9d2\" stroke=\"#291419\" stroke-width=\"11\"/>\u003cellipse cx=\"250\" cy=\"151\" rx=\"93\" ry=\"110\" fill=\"#ffc348\" stroke=\"#291419\" stroke-width=\"8\"/>\u003cg stroke=\"#a65532\" stroke-width=\"3\" opacity=\".7\">\u003cpath d=\"m250 48 0 40m40-31-15 36m43-17-27 28m42-2-33 17m41 16-39 5m32 34-37-10m17 45-30-25m4 48-21-37m-20 46-2-43m-40 34 19-36m-43 18 31-27m-45-4 40-7m-36-36 40 7m-27-42 34 20m-9-48 22 36\"/>\u003c/g>\u003cellipse cx=\"250\" cy=\"151\" rx=\"43\" ry=\"66\" fill=\"#291419\"/>\u003cellipse cx=\"267\" cy=\"124\" rx=\"13\" ry=\"19\" fill=\"#f5e9d2\"/>\u003cpath d=\"M57 137q53-46 99-54m190 2q57 13 94 49\" fill=\"none\" stroke=\"#291419\" stroke-width=\"4\"/>\u003c/svg>\u003cspan class=\"logo-text\">SE\u003cbr>RØDT\u003c/span>\u003c/a>\u003cp>Endelig ser du det, alle andre skriger over. Gys, film og fællesskab med plads til flere måder at se på.\u003c/p>\u003c/div>\n\u003cdiv>\u003ch2>Find vej på siden\u003c/h2>\u003cnav class=\"footer-links\" aria-label=\"Navigation i sidefod\">\u003ca href=\"#forside\">Forside\u003c/a>\u003ca href=\"#program\">Program\u003c/a>\u003ca href=\"#filter\">Om filteret\u003c/a>\u003ca href=\"#praktisk\">Praktisk info\u003c/a>\u003ca href=\"#faq\">FAQ\u003c/a>\u003ca href=\"#billetter\">Køb billet\u003c/a>\u003c/nav>\u003c/div>\n\u003cdiv>\u003ch2>Vi ses i mørket\u003c/h2>\u003cp>30.–31. oktober\u003cbr>Refshaleøen, København\u003cbr>For alle fra 18 år\u003c/p>\u003c/div>\u003c/div>\n\u003cdiv class=\"footer-bottom\">\u003cspan>SE RØDT · Et skoleprojekt og festival-koncept. Billetvalg er en demo.\u003c/span>\n\u003cdetails class=\"credits\">\u003csummary>Design, illustrationer og kilder\u003c/summary>\u003cp>Visuel retning: gruppens Figma og moodboard. Gruppens billedinspiration: \u003ca href=\"https://dk.pinterest.com/\">Pinterest\u003c/a> og \u003ca href=\"https://pixabay.com/da/\">Pixabay\u003c/a>. Øjet og filterillustrationen er tegnet til prototypen. Filmkortene viser officielle trailerafspillere. Film og trailers tilhører deres respektive rettighedshavere; de er ikke angivet s  href=\"#main\">Spring til indhold\u003c/a>\n\u003cdiv class=\"topline\">30.–31. oktober &nbsp; · &nbsp; Refshaleøen, København &nbsp; · &nbsp; 18+\u003c/div>\n\u003cheader class=\"site-header\">\u003cdiv class=\"wrap nav\">\u003ca class=\"logo\" href=\"#forside\" aria-label=\"SE RØDT — forsiden\">\u003csvg viewBox=\"0 0 500 290\" xmlns=\"http://www.w3.org/2000/svg\" aria-hidden=\"true\">\u003cg fill=\"none\" stroke=\"#291419\" stroke-width=\"9\" stroke-linecap=\"round\">\u003cpath d=\"M65 81 42 47m72 12-8-38m73 23 8-36m67 31 19-31m56 48 29-29m41 57 39-17M60 206l-28 30m78-12-12 38m78-25 9 38m66-39 18 34m63-50 30 28m38-57 42 14\"/>\u003c/g>\u003cpath d=\"M20 150Q250-80 480 150Q250 390 20 150Z\" fill=\"#f5e9d2\" stroke=\"#291419\" stroke-width=\"11\"/>\u003cellipse cx=\"250\" cy=\"151\" rx=\"93\" ry=\"110\" fill=\"#ffc348\" stroke=\"#291419\" stroke-width=\"8\"/>\u003cg stroke=\"#a65532\" stroke-width=\"3\" opacity=\".7\">\u003cpath d=\"m250 48 0 40m40-31-15 36m43-17-27 28m42-2-33 17m41 16-39 5m32 34-37-10m17 45-30-25m4 48-21-37m-20 46-2-43m-40 34 19-36m-43 18 31-27m-45-4 40-7m-36-36 40 7m-27-42 34 20m-9-48 22 36\"/>\u003c/g>\u003cellipse cx=\"250\" cy=\"151\" rx=\"43\" ry=\"66\" fill=\"#291419\"/>\u003cellipse cx=\"267\" cy=\"124\" rx=\"13\" ry=\"19\" fill=\"#f5e9d2\"/>\u003cpath d=\"M57 137q53-46 99-54m190 2q57 13 94 49\" fill=\"none\" stroke=\"#291419\" stroke-width=\"4\"/>\u003c/svg>\u003cspan class=\"logo-text\">SE\u003cbr>RØDT\u003c/span>\u003c/a>\n\u003cbutton class=\"menu-toggle\" type=\"button\" aria-expanded=\"false\" aria-controls=\"main-navigation\">Menu \u003cspan aria-hidden=\"true\">☰\u003c/span>\u003c/button>\n\u003cnav class=\"nav-links\" id=\"main-navigation\" aria-label=\"Hovednavigation\">\u003ca href=\"#program\">Program\u003c/a>\u003ca href=\"#filter\">Om filteret\u003c/a>\u003ca href=\"#praktisk\">Praktisk info\u003c/a>\u003ca href=\"#faq\" aria-current=\"page\">FAQ\u003c/a>\u003ca href=\"#billetter\" class=\"button\">Køb billet\u003c/a>\u003c/nav>\u003c/div>\u003c/header>\u003cmain id=\"main\">\u003cdiv class=\"wrap\">\u003cdiv class=\"page-intro\">\u003cp class=\"eyebrow gold\">Et godt spørgsmål er en god start\u003c/p>\u003ch1>SPØRG BARE.\u003cbr>VI BIDER IKKE.\u003c/h1>\u003cp>Her er svar på de mest oplagte spørgsmål om SE RØDT, filteret og din aften i biografen.\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"wrap page-content faq-layout\">\u003csection class=\"faq-list\" aria-label=\"Ofte stillede spørgsmål\">\u003cdetails>\u003csummary>Skal jeg være farveblind for at deltage?\u003c/summary>\u003cp>Nej. Alle fra 18 år er velkomne. Festival-konceptet er designet med fokus på mennesker med protanopi, men tag gerne en ven med.\u003c/p>\u003c/details>\u003cdetails>\u003csummary>Hvordan virker farvefilteret?\u003c/summary>\u003cp>Konceptet bruger daltonisering, som flytter udvalgte farvenuancer, så nogle forskelle bliver tydeligere. Det genskaber ikke normalt farvesyn. Du kan se en illustration af princippet på siden Om filteret.\u003c/p>\u003c/details>\u003cdetails>\u003csummary>Hvad hvis jeg har en anden type farveblindhed?\u003c/summary>\u003cp>SE RØDT fokuserer på protanopi. Oplevelsen kan variere, og konceptet lover ikke en bestemt effekt ved andre typer farveblindhed.\u003c/p>\u003c/details>\u003cdetails>\u003csummary>Hvor uhyggelige er filmene?\u003c/summary>\u003cp>Programmet blander klassikere og mere intense film. Vi bruger en gyseskala fra 1 til 5 med tal og tekst. Vurderingerne på prototypen er foreløbige redaktionelle forslag.\u003c/p>\u003c/details>\u003cdetails>\u003csummary>Hvad er aldersgrænsen?\u003c/summary>\u003cp>Festival-konceptet er for voksne fra 18 år på grund af baren og filmenes indhold.\u003c/p>\u003c/details>\u003cdetails>\u003csummary>Kan jeg vælge kun én aften?\u003c/summary>\u003cp>Ja. Konceptets priser er 299 kr. for fredag og 349 kr. for lørdag. Festivalpasset til begge aftener koster 549 kr.\u003c/p>\u003c/details>\u003cdetails>\u003csummary>Er der mad og drikke?\u003c/summary>\u003cp>Konceptet omfatter food trucks og en Halloween-bar samt vegetariske og veganske madmuligheder.\u003c/p>\u003c/details>\u003cdetails>\u003csummary>Skal jeg være udklædt?\u003c/summary>\u003cp>Nej, udklædning er frivillig. Der er en kostumekonkurrence i lørdagens program.\u003c/p>\u003c/details>\u003cdetails>\u003csummary>Er der adgang for kørestolsbrugere?\u003c/summary>\u003cp>Konceptet omfatter niveaufri adgang og handicaptoilet. De konkrete forhold skal bekræftes, når det endelige venue fastlægges.\u003c/p>\u003c/details>\u003cdetails>\u003csummary>Kan jeg få pengene tilbage?\u003c/summary>\u003cp>Eventkonceptet foreslår refusion indtil 7 dage før eventet. Denne hjemmeside er en skoleprototype og sælger ikke rigtige billetter; endelige købsvilkår er ikke fastlagt.\u003c/p>\u003c/details>\u003cdetails>\u003csummary>Hvordan fungerer ledsagerrabatten?\u003c/summary>\u003cp>Konceptet beskriver 50 kr. i rabat til en ven uden farveblindhed. Det er endnu ikke fastlagt, hvilke billettyper rabatten gælder for, og derfor beregnes den ikke i billetdemoen.\u003c/p>\u003c/details>\u003cdetails>\u003csummary>Hvordan kommer jeg til festivalen?\u003c/summary>\u003cp>Festival-konceptet ligger på Refshaleøen i København og lægger op til havnebus, cykelparkering og information om natbus. Præcis adresse og afgange afventer et fastlagt venue og eventår.\u003c/p>\u003c/details>\u003c/section>\u003caside class=\"faq-aside\">\u003csvg viewBox=\"0 0 500 290\" xmlns=\"http://www.w3.org/2000/svg\" aria-hidden=\"true\">\u003cg fill=\"none\" stroke=\"#291419\" stroke-width=\"9\" stroke-linecap=\"round\">\u003cpath d=\"M65 81 42 47m72 12-8-38m73 23 8-36m67 31 19-31m56 48 29-29m41 57 39-17M60 206l-28 30m78-12-12 38m78-25 9 38m66-39 18 34m63-50 30 28m38-57 42 14\"/>\u003c/g>\u003cpath d=\"M20 150Q250-80 480 150Q250 390 20 150Z\" fill=\"#f5e9d2\" stroke=\"#291419\" stroke-width=\"11\"/>\u003cellipse cx=\"250\" cy=\"151\" rx=\"93\" ry=\"110\" fill=\"#ffc348\" stroke=\"#291419\" stroke-width=\"8\"/>\u003cg stroke=\"#a65532\" stroke-width=\"3\" opacity=\".7\">\u003cpath d=\"m250 48 0 40m40-31-15 36m43-17-27 28m42-2-33 17m41 16-39 5m32 34-37-10m17 45-30-25m4 48-21-37m-20 46-2-43m-40 34 19-36m-43 18 31-27m-45-4 40-7m-36-36 40 7m-27-42 34 20m-9-48 22 36\"/>\u003c/g>\u003cellipse cx=\"250\" cy=\"151\" rx=\"43\" ry=\"66\" fill=\"#291419\"/>\u003cellipse cx=\"267\" cy=\"124\" rx=\"13\" ry=\"19\" fill=\"#f5e9d2\"/>\u003cpath d=\"M57 137q53-46 99-54m190 2q57 13 94 49\" fill=\"none\" stroke=\"#291419\" stroke-width=\"4\"/>\u003c/svg>\u003ch2>KLAR TIL\u003cbr>AT BLIVE SKRÆMT?\u003c/h2>\u003cp>Se, hvad der venter på lærredet fredag og lørdag.\u003c/p>\u003ca class=\"text-link\" href=\"#program\" style=\"color:var(--ink)\">Find en film ↗\u003c/a>\u003c/aside>\u003c/div>\u003c/main>\u003cfooter class=\"site-footer\">\u003cdiv class=\"wrap\">\u003cdiv class=\"footer-top\">\n\u003cdiv>\u003ca class=\"logo\" href=\"#forside\" aria-label=\"SE RØDT — forsiden\">\u003csvg viewBox=\"0 0 500 290\" xmlns=\"http://www.w3.org/2000/svg\" aria-hidden=\"true\">\u003cg fill=\"none\" stroke=\"#291419\" stroke-width=\"9\" stroke-linecap=\"round\">\u003cpath d=\"M65 81 42 47m72 12-8-38m73 23 8-36m67 31 19-31m56 48 29-29m41 57 39-17M60 206l-28 30m78-12-12 38m78-25 9 38m66-39 18 34m63-50 30 28m38-57 42 14\"/>\u003c/g>\u003cpath d=\"M20 150Q250-80 480 150Q250 390 20 150Z\" fill=\"#f5e9d2\" stroke=\"#291419\" stroke-width=\"11\"/>\u003cellipse cx=\"250\" cy=\"151\" rx=\"93\" ry=\"110\" fill=\"#ffc348\" stroke=\"#291419\" stroke-width=\"8\"/>\u003cg stroke=\"#a65532\" stroke-width=\"3\" opacity=\".7\">\u003cpath d=\"m250 48 0 40m40-31-15 36m43-17-27 28m42-2-33 17m41 16-39 5m32 34-37-10m17 45-30-25m4 48-21-37m-20 46-2-43m-40 34 19-36m-43 18 31-27m-45-4 40-7m-36-36 40 7m-27-42 34 20m-9-48 22 36\"/>\u003c/g>\u003cellipse cx=\"250\" cy=\"151\" rx=\"43\" ry=\"66\" fill=\"#291419\"/>\u003cellipse cx=\"267\" cy=\"124\" rx=\"13\" ry=\"19\" fill=\"#f5e9d2\"/>\u003cpath d=\"M57 137q53-46 99-54m190 2q57 13 94 49\" fill=\"none\" stroke=\"#291419\" stroke-width=\"4\"/>\u003c/svg>\u003cspan class=\"logo-text\">SE\u003cbr>RØDT\u003c/span>\u003c/a>\u003cp>Endelig ser du det, alle andre skriger over. Gys, film og fællesskab med plads til flere måder at se på.\u003c/p>\u003c/div>\n\u003cdiv>\u003ch2>Find vej på siden\u003c/h2>\u003cnav class=\"footer-links\" aria-label=\"Navigation i sidefod\">\u003ca href=\"#forside\">Forside\u003c/a>\u003ca href=\"#program\">Program\u003c/a>\u003ca href=\"#filter\">Om filteret\u003c/a>\u003ca href=\"#praktisk\">Praktisk info\u003c/a>\u003ca href=\"#faq\">FAQ\u003c/a>\u003ca href=\"#billetter\">Køb billet\u003c/a>\u003c/nav>\u003c/div>\n\u003cdiv>\u003ch2>Vi ses i mørket\u003c/h2>\u003cp>30.–31. oktober\u003cbr>Refshaleøen, København\u003cbr>For alle fra 18 år\u003c/p>\u003c/div>\u003c/div>\n\u003cdiv class=\"footer-bottom\">\u003cspan>SE RØDT · Et skoleprojekt og festival-koncept. Billetvalg er en demo.\u003c/span>\n\u003cdetails class=\"credits\">\u003csummary>Design, illustrationer og kilder\u003c/summary>\u003cp>Visuel retning: gruppens Figma og moodboard. Gruppens billedinspiration: \u003ca href=\"https://dk.pinterest.com/\">Pinterest\u003c/a> og \u003ca href=\"https://pixabay.com/da/\">Pixabay\u003c/a>. Øjet og filterillustrationen er tegnet til prototypen. Filmkortene viser officielle trailerafspillere. Film og trailers tilhører deres respektive rettighedshavere; de er ikke angivet som copyright-frie. Typografisk inspiration: \u003ca href=\"https://www.dafont.com/theme.php?cat=803\">DaFont Halloween\u003c/a>. Overskrifter: \u003ca href=\"https://fonts.google.com/specimen/Bebas+Neue\">Bebas Neue\u003c/a> fra Dharma Type, under \u003ca href=\"data:text/plain;base64,Q29weXJpZ2h0IMKpIDIwMTAgYnkgRGhhcm1hIFR5cGUuCgpUaGlzIEZvbnQgU29mdHdhcmUgaXMgbGljZW5zZWQgdW5kZXIgdGhlIFNJTCBPcGVuIEZvbnQgTGljZW5zZSwgVmVyc2lvbiAxLjEuClRoaXMgbGljZW5zZSBpcyBjb3BpZWQgYmVsb3csIGFuZCBpcyBhbHNvIGF2YWlsYWJsZSB3aXRoIGEgRkFRIGF0OgpodHRwOi8vc2NyaXB0cy5 /div>\u003cdiv class=\"trailer-frame\" id=\"trailer-frame\" hidden>\u003c/div>\u003c/div>\u003cp id=\"trailer-status\" role=\"status\" aria-live=\"polite\">\u003c/p>\u003ca class=\"button trailer-external\" id=\"trailer-external\" target=\"_blank\" rel=\"noopener noreferrer\">Se på YouTube ↗\u003c/a>\u003cp id=\"trailer-publisher\">\u003c/p>\u003c/dialog>","title":"FAQ — spørgsmål om festival, filter og billetter | SE RØDT","description":"Få svar om SE RØDT: protanopi, farvefilter, aldersgrænse, billetpriser, adgangsforhold og udklædning. Alle voksne er velkomne.","schema":{"@context":"https://schema.org","@graph":[{"@type":"WebSite","@id":"https://se-rodt-filmfestival-olive.oliverbbdk.chatgpt.site/#website","url":"https://se-rodt-filmfestival-olive.oliverbbdk.chatgpt.site/","name":"SE RØDT","inLanguage":"da"},{"@type":"WebPage","@id":"https://se-rodt-filmfestival-olive.oliverbbdk.chatgpt.site/faq.html#webpage","url":"https://se-rodt-filmfestival-olive.oliverbbdk.chatgpt.site/faq.html","name":"FAQ — spørgsmål om festival, filter og billetter | SE RØDT","description":"Få svar om SE RØDT: protanopi, farvefilter, aldersgrænse, billetpriser, adgangsforhold og udklædning. Alle voksne er velkomne.","inLanguage":"da","isPartOf":{"@id":"https://se-rodt-filmfestival-olive.oliverbbdk.chatgpt.site/#website"}},{"@type":"FAQPage","@id":"https://se-rodt-filmfestival-olive.oliverbbdk.chatgpt.site/faq.html#faq","mainEntity":[{"@type":"Question","name":"Skal jeg være farveblind for at deltage?","acceptedAnswer":{"@type":"Answer","text":"Nej. Alle fra 18 år er velkomne. Festival-konceptet er designet med fokus på mennesker med protanopi, men tag gerne en ven med."}},{"@type":"Question","name":"Hvordan virker farvefilteret?","acceptedAnswer":{"@type":"Answer","text":"Konceptet bruger daltonisering, som flytter udvalgte farvenuancer, så nogle forskelle bliver tydeligere. Det genskaber ikke normalt farvesyn. Du kan se en illustration af princippet på siden Om filteret."}},{"@type":"Question","name":"Hvad hvis jeg har en anden type farveblindhed?","acceptedAnswer":{"@type":"Answer","text":"SE RØDT fokuserer på protanopi. Oplevelsen kan variere, og konceptet lover ikke en bestemt effekt ved andre typer farveblindhed."}},{"@type":"Question","name":"Hvor uhyggelige er filmene?","acceptedAnswer":{"@type":"Answer","text":"Programmet blander klassikere og mere intense film. Vi bruger en gyseskala fra 1 til 5 med tal og tekst. Vurderingerne på prototypen er foreløbige redaktionelle forslag."}},{"@type":"Question","name":"Hvad er aldersgrænsen?","acceptedAnswer":{"@type":"Answer","text":"Festival-konceptet er for voksne fra 18 år på grund af baren og filmenes indhold."}},{"@type":"Question","name":"Kan jeg vælge kun én aften?","acceptedAnswer":{"@type":"Answer","text":"Ja. Konceptets priser er 299 kr. for fredag og 349 kr. for lørdag. Festivalpasset til begge aftener koster 549 kr."}},{"@type":"Question","name":"Er der mad og drikke?","acceptedAnswer":{"@type":"Answer","text":"Konceptet omfatter food trucks og en Halloween-bar samt vegetariske og veganske madmuligheder."}},{"@type":"Question","name":"Skal jeg være udklædt?","acceptedAnswer":{"@type":"Answer","text":"Nej, udklædning er frivillig. Der er en kostumekonkurrence i lørdagens program."}},{"@type":"Question","name":"Er der adgang for kørestolsbrugere?","acceptedAnswer":{"@type":"Answer","text":"Konceptet omfatter niveaufri adgang og handicaptoilet. De konkrete forhold skal bekræftes, når det endelige venue fastlægges."}},{"@type":"Question","name":"Kan jeg få pengene tilbage?","acceptedAnswer":{"@type":"Answer","text":"Eventkonceptet foreslår refusion indtil 7 dage før eventet. Denne hjemmeside er en skoleprototype og sælger ikke rigtige billetter; endelige købsvilkår er ikke fastlagt."}},{"@type":"Question","name":"Hvordan fungerer ledsagerrabatten?","acceptedAnswer":{"@type":"Answer","text":"Konceptet beskriver 50 kr. i rabat til en ven uden farveblindhed. Det er endnu ikke fastlagt, hvilke billettyper rabatten gælder for, og derfor beregnes den ikke i billetdemoen."}},{"@type":"Question","name":"Hvordan kommer jeg til festivalen?","acceptedAnswer":{"@type":"Answer","text":"Festival-konceptet ligger på Refshaleøen i København og lægger op til havnebus, cykelparkering og information om natbus. Præcis adresse og afgange afventer et fastlagt venue og eventår."}}]}]},"canonical":"https://se-rodt-filmfestival-olive.oliverbbdk.chatgpt.site/faq.html"},"billetter":{"html":"\u003ca class=\"skip\" href=\"#main\">Spring til indhold\u003c/a>\n\u003cdiv class=\"topline\">30.–31. oktober &nbsp; · &nbsp; Refshaleøen, København &nbsp; · &nbsp; 18+\u003c/div>\n\u003cheader class=\"site-header\">\u003cdiv class=\"wrap nav\">\u003ca class=\"logo\" href=\"#forside\" aria-label=\"SE RØDT — forsiden\">\u003csvg viewBox=\"0 0 500 290\" xmlns=\"http://www.w3.org/2000/svg\" aria-hidden=\"true\">\u003cg fill=\"none\" stroke=\"#291419\" stroke-width=\"9\" stroke-linecap=\"round\">\u003cpath d=\"M65 81 42 47m72 12-8-38m73 23 8-36m67 31 19-31m56 48 29-29m41 57 39-17M60 206l-28 30m78-12-12 38m78-25 9 38m66-39 18 34m63-50 30 28m38-57 42 14\"/>\u003c/g>\u003cpath d=\"M20 150Q250-80 480 150Q250 390 20 150Z\" fill=\"#f5e9d2\" stroke=\"#291419\" stroke-width=\"11\"/>\u003cellipse cx=\"250\" cy=\"151\" rx=\"93\" ry=\"110\" fill=\"#ffc348\" stroke=\"#291419\" stroke-width=\"8\"/>\u003cg stroke=\"#a65532\" stroke-width=\"3\" opacity=\".7\">\u003cpath d=\"m250 48 0 40m40-31-15 36m43-17-27 28m42-2-33 17m41 16-39 5m32 34-37-10m17 45-30-25m4 48-21-37m-20 46-2-43m-40 34 19-36m-43 18 31-27m-45-4 40-7m-36-36 40 7m-27-42 34 20m-9-48 22 36\"/>\u003c/g>\u003cellipse cx=\"250\" cy=\"151\" rx=\"43\" ry=\"66\" fill=\"#291419\"/>\u003cellipse cx=\"267\" cy=\"124\" rx=\"13\" ry=\"19\" fill=\"#f5e9d2\"/>\u003cpath d=\"M57 137q53-46 99-54m190 2q57 13 94 49\" fill=\"none\" stroke=\"#291419\" stroke-width=\"4\"/>\u003c/svg>\u003cspan class=\"logo-text\">SE\u003cbr>RØDT\u003c/span>\u003c/a>\n\u003cbutton class=\"menu-toggle\" type=\"button\" aria-expanded=\"false\" aria-controls=\"main-navigation\">Menu \u003cspan aria-hidden=\"true\">☰\u003c/span>\u003c/button>\n\u003cnav class=\"nav-links\" id=\"main-navigation\" aria-label=\"Hovednavigation\">\u003ca href=\"#program\">Program\u003c/a>\u003ca href=\"#filter\">Om filteret\u003c/a>\u003ca href=\"#praktisk\">Praktisk info\u003c/a>\u003ca href=\"#faq\">FAQ\u003c/a>\u003ca href=\"#billetter\" aria-current=\"page\" class=\"button\">Køb billet\u003c/a>\u003c/nav>\u003c/div>\u003c/header>\u003cmain id=\"main\">\u003cdiv class=\"wrap\">\u003cdiv class=\"page-intro\">\u003cp class=\"eyebrow gold\">Vælg din plads i mørket\u003c/p>\u003ch1>HVOR MEGET GYS\u003cbr>KAN DU KLARE?\u003c/h1>\u003cp>Én aften, begge dage eller lidt ekstra. Sammenlign billetmulighederne og prøv dit valg i demoen.\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"wrap page-content\">\u003cform id=\"ticket-form\">\u003cfieldset class=\"ticket-selection\">\u003clegend>Vælg billettype\u003c/legend>\u003cdiv class=\"ticket-grid\">\u003clabel class=\"ticket-option\">\u003cinput type=\"radio\" name=\"ticket\" value=\"299\" data-name=\"Fredag\">\u003cspan class=\"type-label\">Første gang rødt\u003c/span>\u003ch2>Fredag\u003c/h2>\u003cspan class=\"price\">299\u003cspan>KR.\u003c/span>\u003c/span>\u003cul>\u003cli>Fredag 30. oktober\u003c/li>\u003cli>Film og aftenaktiviteter\u003c/li>\u003cli>Dørene åbner kl. 18:00\u003c/li>\u003c/ul>\u003cspan class=\"ticket-foot\">EN AFTEN I MØRKET\u003c/span>\u003c/label>\u003clabel class=\"ticket-option\">\u003cinput type=\"radio\" name=\"ticket\" value=\"349\" data-name=\"Lørdag\">\u003cspan class=\"type-label\">Halloween-nat\u003c/span>\u003ch2>Lørdag\u003c/h2>\u003cspan class=\"price\">349\u003cspan>KR.\u003c/span>\u003c/span>\u003cul>\u003cli>Lørdag 31. oktober\u003c/li>\u003cli>Film, talk og Halloween\u003c/li>\u003cli>Aktiviteter fra kl. 16:00\u003c/li>\u003c/ul>\u003cspan class=\"ticket-foot\">GYS PÅ HALLOWEEN\u003c/span>\u003c/label>\u003clabel class=\"ticket-option selected\">\u003cinput type=\"radio\" name=\"ticket\" value=\"549\" data-name=\"Festivalpas\" checked>\u003cspan class=\"type-label\">Hele oplevelsen\u003c/span>\u003ch2>Festivalpas\u003c/h2>\u003cspan class=\"price\">549\u003cspan>KR.\u003c/span>\u003c/span>\u003cul>\u003cli>Begge aftener\u003c/li>\u003cli>Fredagens og lørdagens film\u003c/li>\u003cli>Spar 99 kr. ift. to enkeltbilletter\u003c/li>\u003c/ul>\u003cspan class=\"ticket-foot\">TO AFTENER. ÉT PAS.\u003c/span>\u003c/label>\u003clabel class=\"ticket-option\">\u003cinput type=\"radio\" name=\"ticket\" value=\"799\" data-name=\"Crimson Pass\">\u003cspan class=\"type-label\">VIP-oplevelsen\u003c/span>\u003ch2>Crimson Pass\u003c/h2>\u003cspan class=\"price\">799\u003cspan>KR.\u003c/span>\u003c/span>\u003cul>\u003cli>Reserveret sæde og drink\u003c/li>\u003cli>Goodiebag og meet & greet\u003c/li>\u003cli>Gyldighedsdage skal bekræftes\u003c/li>\u003c/ul>\u003cspan class=\"ticket-foot\">LIDT MERE AF DET HELE\u003c/span>\u003c/label>\u003c/div>\u003c/fieldset>\u003cdiv class=\"order-bar\">\u003clabel for=\"quantity\">Antal billetter \u003cselect id=\"quantity\" name=\"quantity\">\u003coption value=\"1\">1\u003c/option>\u003coption value=\"2\">2\u003c/option>\u003coption value=\"3\">3\u003c/option>\u003coption value=\"4\">4\u003c/option>\u003coption value=\"5\">5\u003c/option>\u003coption value=\"6\">6\u003c/option>\u003c/select>\u003c/label>\u003cdiv class=\"order-total\">\u003csmall id=\"selected-ticket\">1 × Festivalpas\u003c/small>\u003cspan id=\"order-total\" aria-live=\"polite\" aria-atomic=\"true\">549 kr.\u003c/span>\u003c/div>\u003cbutton class=\"button\" type=\"submit\">Se dit billetvalg \u003cspan aria-hidden=\"true\">↗\u003c/span>\u003c/button>\u003c/div>\u003c/form>\n\u003cp class=\"order-fine\">\u003cstrong>Billetdemo:\u003c/strong> Der foretages ingen betaling eller reservation. Priserne stammer fra skoleprojektets eventkoncept. En rigtig billetudbyder er ikke tilkoblet.\u003c/p>\u003cp class=\"note\">\u003cstrong>En ven med?\u003c/strong> Konceptet beskriver en ledsagerrabat på 50 kr. Reglerne for, hvilke billetter den gælder for, mangler, så rabatten indgår ikke i demoens beregning. VIP's gyldighedsdage skal også fastlægges.\u003c/p>\n\u003csection class=\"section\" style=\"padding-bottom:0\">\u003cdiv class=\"info-grid\">\u003cdiv>\u003cp class=\"eyebrow gold\">Godt at vide\u003c/p>\u003ch2>GYS ER BEDST\u003cbr>I FÆLLESSKAB.\u003c/h2>\u003c/div>\u003cdiv>\u003cp>Alle er velkomne fra 18 år, også gæster uden farveblindhed. Tag en ven med, og oplev klassikerne sammen.\u003c/p>\u003cp>\u003ca class=\"text-link\" href=\"#faq\">Få svar om billetter og adgang ↗\u003c/a>\u003c/p>\u003c/div>\u003c/div>\u003c/section>\u003c/div>\n\u003cdialog class=\"dialog\" id=\"ticket-dialog\" aria-labelledby=\"ticket-dialog-title\">\u003cp class=\"eyebrow gold\">Dit valg i billetdemoen\u003c/p>\u003ch2 id=\"ticket-dialog-title\">EN GOD AFTEN\u003cbr>STARTER HER.\u003c/h2>\u003cp id=\"demo-selection\">\u003c/p>\u003cp>Dette er en demonstration af billetvalget. Der er ikke bestilt eller reserveret en billet, og der trækkes ingen penge.\u003c/p>\u003cbutton type=\"button\" class=\"button\" id=\"close-ticket-dialog\">Tilbage til billetter\u003c/button>\u003c/dialog>\u003c/main>\u003cfooter class=\"site-footer\">\u003cdiv class=\"wrap\">\u003cdiv class=\"footer-top\">\n\u003cdiv>\u003ca class=\"logo\" href=\"#forside\" aria-label=\"SE RØDT — forsiden\">\u003csvg viewBox=\"0 0 500 290\" xmlns=\"http://www.w3.org/2000/svg\" aria-hidden=\"true\">\u003cg fill=\"none\" stroke=\"#291419\" stroke-width=\"9\" stroke-linecap=\"round\">\u003cpath d=\"M65 81 42 47m72 12-8-38m73 23 8-36m67 31 19-31m56 48 29-29m41 57 39-17M60 206l-28 30m78-12-12 38m78-25 9 38m66-39 18 34m63-50 30 28m38-57 42 14\"/>\u003c/g>\u003cpath d=\"M20 150Q250-80 480 150Q250 390 20 150Z\" fill=\"#f5e9d2\" stroke=\"#291419\" stroke-width=\"11\"/>\u003cellipse cx=\"250\" cy=\"151\" rx=\"93 <script>
const pages = JSON.parse(document.querySelector('#page-data').textContent);
const pageHost = document.querySelector('#site');
let currentRoute = '';
function initializePage(pageRoot) {
document.documentElement.classList.add('js-ready');

const menuButton = document.querySelector('.menu-toggle');
const menu = document.querySelector('.nav-links');
menuButton?.addEventListener('click', () => {
  const expanded = menuButton.getAttribute('aria-expanded') === 'true';
  menuButton.setAttribute('aria-expanded', String(!expanded));
  menu.classList.toggle('open', !expanded);
});
pageRoot.addEventListener('keydown', event => {
  if (event.key === 'Escape' && menu?.classList.contains('open')) {
    menu.classList.remove('open');
    menuButton.setAttribute('aria-expanded', 'false');
    menuButton.focus();
  }
});

const dayButtons = [...document.querySelectorAll('[data-day-button]')];
function selectDay(day) {
  dayButtons.forEach(button => button.setAttribute('aria-pressed', String(button.dataset.dayButton === day)));
  document.querySelectorAll('[data-day-program]').forEach(program => {
    program.hidden = program.dataset.dayProgram !== day;
  });
}
if (dayButtons.length) {
  const requestedDay = new URLSearchParams(location.search).get('dag');
  selectDay(requestedDay === 'lordag' ? 'lordag' : 'fredag');
  dayButtons.forEach(button => button.addEventListener('click', () => {
    selectDay(button.dataset.dayButton);
  }));
}

const comparison = document.querySelector('#comparison-position');
const stage = document.querySelector('.compare-stage');
comparison?.addEventListener('input', () => {
  stage.style.setProperty('--position', `${comparison.value}%`);
  comparison.setAttribute('aria-valuetext', `${comparison.value} procent original illustration`);
});

const ticketForm = document.querySelector('#ticket-form');
if (ticketForm) {
  const quantity = ticketForm.querySelector('#quantity');
  const total = document.querySelector('#order-total');
  const selectedText = document.querySelector('#selected-ticket');
  const dialog = document.querySelector('#ticket-dialog');
  const formatPrice = amount => new Intl.NumberFormat('da-DK', {
    style: 'currency', currency: 'DKK', maximumFractionDigits: 0
  }).format(amount);
  function updateOrder() {
    const selected = ticketForm.querySelector('input[name="ticket"]:checked');
    ticketForm.querySelectorAll('.ticket-option').forEach(card => {
      card.classList.toggle('selected', card.contains(selected));
    });
    const count = Number(quantity.value);
    total.textContent = formatPrice(Number(selected.value) * count);
    selectedText.textContent = `${count} × ${selected.dataset.name}`;
    return { selected, count, price: Number(selected.value) * count };
  }
  ticketForm.addEventListener('change', updateOrder);
  ticketForm.addEventListener('submit', event => {
    event.preventDefault();
    const { selected, count, price } = updateOrder();
    document.querySelector('#demo-selection').textContent = `${count} × ${selected.dataset.name} — ${formatPrice(price)}`;
    dialog.showModal();
  });
  document.querySelector('#close-ticket-dialog').addEventListener('click', () => dialog.close());
  dialog.addEventListener('click', event => { if (event.target === dialog) dialog.close(); });
  updateOrder();
}

const trailerDialog = document.querySelector('#trailer-dialog');
// Keep real YouTube links usable without JavaScript and in the downloadable file.
if (trailerDialog && location.protocol !== 'file:' && !document.documentElement.hasAttribute('data-standalone')) {
  const frameHost = document.querySelector('#trailer-frame');
  const poster = document.querySelector('#trailer-poster');
  const posterImage = document.querySelector('#trailer-poster-image');
  const status = document.querySelector('#trailer-status');
  const retry = document.querySelector('#retry-trailer');
  let apiPromise;
  let player;
  let currentLink;
  let attempt = 0;
  let readyTimeout;
  let playbackTimeout;

  function loadYouTube() {
    if (window.YT?.Player) return Promise.resolve(window.YT);
    if (apiPromise) return apiPromise;
    apiPromise = new Promise((resolve, reject) => {
      const script = document.createElement('script');
      const previousCallback = window.onYouTubeIframeAPIReady;
      const timeout = setTimeout(fail, 8000);
      function fail() {
        clearTimeout(timeout);
        script.remove();
        apiPromise = undefined;
        reject(new Error('YouTube unavailable'));
      }
      window.onYouTubeIframeAPIReady = () => {
        clearTimeout(timeout);
        if (typeof previousCallback === 'function') previousCallback();
        resolve(window.YT);
      };
      script.src = 'https://www.youtube.com/iframe_api';
      script.onerror = fail;
      document.head.append(script);
    });
    return apiPromise;
  }

  function clearPlayer() {
    clearTimeout(readyTimeout);
    clearTimeout(playbackTimeout);
    if (player) {
      player.destroy();
      player = undefined;
    }
    frameHost.replaceChildren();
    frameHost.hidden = true;
  }

  function showFallback(message) {
    attempt++;
    clearPlayer();
    poster.hidden = false;
    retry.hidden = false;
    status.textContent = message;
  }

  async function startTrailer(link) {
    clearPlayer();
    const token = ++attempt;
    const video = link.dataset.trailerId;
    const title = link.dataset.trailerTitle;
    poster.hidden = false;
    retry.hidden = true;
    status.textContent = 'Indlæser den officielle trailer. Du kan også se den direkte på YouTube.';
    try {
      const yt = await loadYouTube();
      if (token !== attempt || !trailerDialog.open) return;
      const frame = document.createElement('iframe');
      frame.title = 'Officiel trailer til ' + title;
      const params = new URLSearchParams({rel:'0', enablejsapi:'1', origin:location.origin, autoplay:'1', playsinline:'1'});
      frame.src = 'https://www.youtube-nocookie.com/embed/' + video + '?' + params;
      frame.referrerPolicy = 'strict-origin-when-cross-origin';
      frame.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';
      frame.allowFullscreen = true;
      frameHost.replaceChildren(frame);
      frameHost.hidden = false;
      // Keep the poster visible over a loading iframe until YouTube confirms readiness.
      readyTimeout = setTimeout(() => {
        if (token === attempt) showFallback('Afspilleren kunne ikke indlæses her. Brug “Se på YouTube” for at åbne traileren.');
      }, 12000);
      player = new yt.Player(frame, {events: {
        onReady: () => {
          if (token !== attempt) return;
          clearTimeout(readyTimeout);
          poster.hidden = true;
          status.textContent = 'Tryk på afspil, hvis traileren ikke starter automatisk. “Se på YouTube” er altid tilgængelig.';
          playbackTimeout = setTimeout(() => {
            if (token === attempt) showFallback('Afspilningen kunne ikke starte her. Se den officielle trailer på YouTube.');
          }, 18000);
        },
        onStateChange: event => {
          if (token !== attempt) return;
          if ([0, 1, 2].includes(event.data)) clearTimeout(playbackTimeout);
          if (event.data === 1) status.textContent = 'Den officielle trailer afspilles via YouTube.';
        },
        onAutoplayBlocked: () => {
          if (token !== attempt) return;
          clearTimeout(playbackTimeout);
          status.textContent = 'Tryk på afspil i videoen, eller vælg “Se på YouTube”.';
        },
        onError: () => {
          if (token === attempt) showFallback('YouTube kan ikke afspille traileren på denne side. Åbn den med “Se på YouTube”.');
        }
      }});
    } catch {
      if (token === attempt) showFallback('Forbindelsen til YouTube kunne ikke oprettes. Åbn traileren med “Se på YouTube”.');
    }
  }

  posterImage.addEventListener('error', () => { posterImage.hidden = true; });
  document.querySelectorAll('[data-trailer-id]').forEach(link => {
    link.addEventListener('click', event => {
      if (event.ctrlKey || event.metaKey || event.shiftKey || event.altKey || event.button !== 0) return;
      if (!/^[A-Za-z0-9_-]{11}$/.test(link.dataset.trailerId)) return;
      event.preventDefault();
      currentLink = link;
      const title = link.dataset.trailerTitle;
      document.querySelector('#trailer-dialog-title').textContent = title + ' — officiel trailer';
      document.querySelector('#trailer-poster-title').textContent = title;
      document.querySelector('#trailer-publisher').textContent = 'Udgivet af ' + link.dataset.trailerPublisher + '.';
      document.querySelector('#trailer-external').href = link.href;
      posterImage.hidden = !link.dataset.trailerThumbnail;
      if (link.dataset.trailerThumbnail) posterImage.src = link.dataset.trailerThumbnail;
      trailerDialog.showModal();
      startTrailer(link);
    });
  });
  retry.addEventListener('click', () => { if (currentLink) startTrailer(currentLink); });
  document.querySelector('#close-trailer-dialog').addEventListener('click', () => trailerDialog.close());
  trailerDialog.addEventListener('click', event => { if (event.target === trailerDialog) trailerDialog.close(); });
  trailerDialog.addEventListener('close', () => {
    attempt++;
    clearPlayer();
    currentLink?.focus();
  });
}

// Filter only the current evening; keep all source text available without JavaScript.
const programSearch = document.querySelector('#program-search');
if (programSearch) {
  const levelFilter = document.querySelector('#program-level');
  const onlyFilms = document.querySelector('#films-only');
  const resultCount = document.querySelector('#program-match-count');
  const emptyResult = document.querySelector('#program-empty');
  function applyProgramSearch() {
    const query = programSearch.value.trim().toLocaleLowerCase('da-DK');
    const level = levelFilter.value;
    let visibleCount = 0;
    document.querySelectorAll('[data-day-program]').forEach(evening => {
      evening.querySelectorAll('[data-program-entry]').forEach(entry => {
        const match = entry.textContent.toLocaleLowerCase('da-DK').includes(query)
          && (!onlyFilms.checked || entry.dataset.programKind === 'film')
          && (!level || entry.dataset.scare === level);
        entry.hidden = !match;
        if (match && !evening.hidden) visibleCount++;
      });
      evening.querySelectorAll('[data-small-hall]').forEach(hall => {
        hall.hidden = ![...hall.querySelectorAll('[data-program-entry]')].some(entry => !entry.hidden);
      });
    });
    resultCount.textContent = visibleCount === 1 ? '1 programpunkt på den valgte aften' : visibleCount + ' programpunkter på den valgte aften';
    emptyResult.hidden = visibleCount !== 0;
  }
  programSearch.addEventListener('input', applyProgramSearch);
  levelFilter.addEventListener('change', applyProgramSearch);
  onlyFilms.addEventListener('change', applyProgramSearch);
  dayButtons.forEach(button => button.addEventListener('click', applyProgramSearch));
  document.querySelector('#reset-search').addEventListener('click', () => {
    programSearch.value = '';
    levelFilter.value = '';
    onlyFilms.checked = false;
    applyProgramSearch();
    programSearch.focus();
  });
  applyProgramSearch();
}

}
function renderPage() {
  const requested = location.hash.slice(1).split('?')[0];
  if (requested === 'main' && currentRoute) return;
  const route = Object.hasOwn(pages,requested) ? requested : 'forside';
  if (route === currentRoute) return;
  const page = pages[route];
  const pageRoot = document.createElement('div');
  pageRoot.innerHTML = page.html;
  pageHost.replaceChildren(pageRoot);
  currentRoute = route;
  document.title = page.title;
  document.querySelector('meta[name="description"]').content = page.description;
  document.querySelector('link[rel="canonical"]').href = page.canonical;
  document.querySelector('#site-schema').textContent = JSON.stringify(page.schema);
  initializePage(pageRoot);
  window.scrollTo(0,0);
}
window.addEventListener('hashchange', renderPage);
renderPage();
</script></body></html>
